<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記帳本</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Comic Sans MS', sans-serif;
            background: linear-gradient(135deg, #f0e6d6, #f7f1e1);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* 左邊表單 */
        .left-panel {
            flex: 0 0 320px;
            background-color: #fff9f1;
            padding: 30px 20px;
            overflow-y: auto;
            position: sticky;
            top: 0;
            height: 100vh;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.05);
        }

        .left-panel h1 {
            text-align: center;
            color: #d4a29c;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        form label {
            font-size: 1rem;
            color: #d4a29c;
            margin-bottom: 6px;
            display: block;
        }

        form input, form select, form button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #d4a29c;
            border-radius: 10px;
            font-size: 1rem;
            color: #6f4f37;
            outline: none;
        }

        form input:focus, form select:focus, form button:focus {
            border-color: #b47f6f;
            box-shadow: 0 0 5px rgba(180, 127, 111, 0.5);
        }

        form button {
            background-color: #d4a29c;
            color: white;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }

        form button:hover {
            background-color: #b47f6f;
        }

        /* 右邊紀錄 */
        .right-panel {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .right-panel h2 {
            font-size: 1.8rem;
            color: #d4a29c;
            margin-bottom: 20px;
        }

        #records {
            padding-right: 10px;
        }

        .record {
            background-color: #f8f2e1;
            border-radius: 12px;
            border: 1px solid #d4a29c;
            padding: 15px;
            margin: 10px 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .record p {
            margin: 8px 0;
            color: #6f4f37;
            font-size: 1rem;
        }

        .record strong {
            color: #d4a29c;
        }

        /* 滾動條美化（可選） */
        .right-panel::-webkit-scrollbar {
            width: 8px;
        }
        .right-panel::-webkit-scrollbar-thumb {
            background-color: #d4a29c;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h1>簡單記帳本</h1>
            <form id="recordForm">
                <label for="date">日期：</label>
                <input type="date" id="date" required>

                <label for="category">類別：</label>
                <select id="category">
                    <option value="飲食">飲食</option>
                    <option value="交通">交通</option>
                    <option value="娛樂">娛樂</option>
                    <option value="其他">其他</option>
                </select>

                <label for="amount">金額：</label>
                <input type="number" id="amount" required>

                <label for="note">備註：</label>
                <input type="text" id="note">

                <button type="submit">新增記帳</button>
            </form>
        </div>

        <div class="right-panel">
            <h2>記帳紀錄</h2>
            <div id="records"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
